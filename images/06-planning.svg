<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 760" width="520" height="760" style="background:#FFFFFF">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect width="520" height="760" fill="#FFFFFF"/>
  <rect x="228" y="9" width="44" height="22" rx="11" ry="11" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
  <text x="250" y="20" dy="0.35em" text-anchor="middle" font-family="'Trebuchet MS', Verdana, Arial, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="11" fill="#333333">start</text>
  <polyline points="250,31 250,55" fill="none" stroke="#333333" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="160.0" y="55.0" width="180" height="30" fill="#ECECFF" stroke="#9370DB" stroke-width="1"/>
  <text x="250" y="70.0" dy="0.35em" text-anchor="middle" font-family="'Trebuchet MS', Verdana, Arial, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="12" fill="#333333">M1. 주제 입력</text>
  <polyline points="250,85 250,115" fill="none" stroke="#333333" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="135.0" y="115.0" width="230" height="40" fill="#ECECFF" stroke="#9370DB" stroke-width="1"/>
  <text x="250" y="128.0" dy="0.35em" text-anchor="middle" font-family="'Trebuchet MS', Verdana, Arial, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="12" fill="#333333">M2. 계획 수립 (Planner)</text>
  <text x="250" y="142.0" dy="0.35em" text-anchor="middle" font-family="'Trebuchet MS', Verdana, Arial, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="11" fill="#333333">(작성할 항목을 단계 목록으로 생성)</text>
  <rect x="30" y="195" width="450" height="355" fill="#FBF4FB" stroke="#E53935" stroke-width="1"/>
  <polyline points="250,155 250,239" fill="none" stroke="#333333" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="228" y="239" width="44" height="22" rx="11" ry="11" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
  <text x="250" y="250" dy="0.35em" text-anchor="middle" font-family="'Trebuchet MS', Verdana, Arial, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="11" fill="#333333">start</text>
  <polyline points="250,261 250,285" fill="none" stroke="#333333" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="140.0" y="285.0" width="220" height="40" fill="#ECECFF" stroke="#9370DB" stroke-width="1"/>
  <text x="250" y="298.0" dy="0.35em" text-anchor="middle" font-family="'Trebuchet MS', Verdana, Arial, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="12" fill="#333333">T1. 현재 단계 선택</text>
  <text x="250" y="312.0" dy="0.35em" text-anchor="middle" font-family="'Trebuchet MS', Verdana, Arial, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="11" fill="#333333">(plan[current_step])</text>
  <polyline points="250,325 250,360" fill="none" stroke="#333333" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="140.0" y="360.0" width="220" height="40" fill="#ECECFF" stroke="#9370DB" stroke-width="1"/>
  <text x="250" y="373.0" dy="0.35em" text-anchor="middle" font-family="'Trebuchet MS', Verdana, Arial, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="12" fill="#333333">T2. 단계 실행</text>
  <text x="250" y="387.0" dy="0.35em" text-anchor="middle" font-family="'Trebuchet MS', Verdana, Arial, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="11" fill="#333333">(LLM이 해당 항목 작성)</text>
  <polyline points="250,400 250,435" fill="none" stroke="#333333" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="140.0" y="435.0" width="220" height="30" fill="#ECECFF" stroke="#9370DB" stroke-width="1"/>
  <text x="250" y="450.0" dy="0.35em" text-anchor="middle" font-family="'Trebuchet MS', Verdana, Arial, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="12" fill="#333333">T3. 결과 누적 · 단계 인덱스 증가</text>
  <polyline points="250,465 250,504" fill="none" stroke="#333333" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="258" y="488" text-anchor="start" font-family="'Trebuchet MS', Verdana, Arial, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="11" fill="#666666">모든 단계 완료</text>
  <rect x="228" y="504" width="44" height="22" rx="11" ry="11" fill="#9370DB" stroke="#9370DB" stroke-width="1"/>
  <text x="250" y="515" dy="0.35em" text-anchor="middle" font-family="'Trebuchet MS', Verdana, Arial, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">end</text>
  <polyline points="360,450 435,450 435,305 361,305" fill="none" stroke="#333333" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="428" y="372" text-anchor="end" font-family="'Trebuchet MS', Verdana, Arial, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="11" fill="#666666">남은 단계 있음</text>
  <text x="428" y="386" text-anchor="end" font-family="'Trebuchet MS', Verdana, Arial, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="11" fill="#666666">(반복)</text>
  <polyline points="250,526 250,575" fill="none" stroke="#333333" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="135.0" y="575.0" width="230" height="40" fill="#ECECFF" stroke="#9370DB" stroke-width="1"/>
  <text x="250" y="588.0" dy="0.35em" text-anchor="middle" font-family="'Trebuchet MS', Verdana, Arial, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="12" fill="#333333">M3. 결과 종합 (Synthesizer)</text>
  <text x="250" y="602.0" dy="0.35em" text-anchor="middle" font-family="'Trebuchet MS', Verdana, Arial, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="11" fill="#333333">(단계별 결과 → 최종 요약문)</text>
  <polyline points="250,615 250,650" fill="none" stroke="#333333" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="160.0" y="650.0" width="180" height="30" fill="#ECECFF" stroke="#9370DB" stroke-width="1"/>
  <text x="250" y="665.0" dy="0.35em" text-anchor="middle" font-family="'Trebuchet MS', Verdana, Arial, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="12" fill="#333333">M4. 최종 결과 출력</text>
  <polyline points="250,680 250,709" fill="none" stroke="#333333" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="228" y="709" width="44" height="22" rx="11" ry="11" fill="#9370DB" stroke="#9370DB" stroke-width="1"/>
  <text x="250" y="720" dy="0.35em" text-anchor="middle" font-family="'Trebuchet MS', Verdana, Arial, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">end</text>
  <text x="255.0" y="211" text-anchor="middle" font-family="'Trebuchet MS', Verdana, Arial, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="11" fill="#E53935" stroke="#FBF4FB" stroke-width="4" stroke-linejoin="round" paint-order="stroke">계획 실행 루프 (Executor)</text>
  <text x="255.0" y="224" text-anchor="middle" font-family="'Trebuchet MS', Verdana, Arial, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="10" fill="#E53935" stroke="#FBF4FB" stroke-width="4" stroke-linejoin="round" paint-order="stroke">(계획의 단계를 하나씩 실행하고 결과를 누적)</text>
</svg>
