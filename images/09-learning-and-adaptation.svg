  <text x="512" y="378" text-anchor="start" font-family="'Trebuchet MS', Verdana, Arial, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="11" fill="#666666">(다음 세대)</text>
  <polyline points="270,500 270,524" fill="none" stroke="#333333" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="278" y="516" text-anchor="start" font-family="'Trebuchet MS', Verdana, Arial, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="11" fill="#666666">최대 세대 도달</text>
  <rect x="248" y="524" width="44" height="22" rx="11" ry="11" fill="#9370DB" stroke="#9370DB" stroke-width="1"/>
  <text x="270" y="535" dy="0.35em" text-anchor="middle" font-family="'Trebuchet MS', Verdana, Arial, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">end</text>
  <polyline points="270,546 270,600" fill="none" stroke="#333333" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="130.0" y="600.0" width="280" height="40" fill="#ECECFF" stroke="#9370DB" stroke-width="1"/>
  <text x="270" y="613.0" dy="0.35em" text-anchor="middle" font-family="'Trebuchet MS', Verdana, Arial, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="12" fill="#333333">M2. 최고 프로그램 + 지표 출력</text>
  <text x="270" y="627.0" dy="0.35em" text-anchor="middle" font-family="'Trebuchet MS', Verdana, Arial, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="11" fill="#333333">(best_program.code / metrics)</text>
