  <text x="270" y="82.0" dy="0.35em" text-anchor="middle" font-family="'Trebuchet MS', Verdana, Arial, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="11" fill="#333333">(세대 0: 초기 프로그램을 평가해 best로 설정)</text>
  <rect x="40" y="130" width="560" height="435" fill="#FBF4FB" stroke="#E53935" stroke-width="1"/>
