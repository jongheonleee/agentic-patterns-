  <text x="170" y="447.0" dy="0.35em" text-anchor="middle" font-family="'Trebuchet MS', Verdana, Arial, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="11" fill="#333333">(best ← 자식 프로그램)</text>
  <rect x="280.0" y="420.0" width="180" height="40" fill="#ECECFF" stroke="#9370DB" stroke-width="1"/>
  <text x="370" y="433.0" dy="0.35em" text-anchor="middle" font-family="'Trebuchet MS', Verdana, Arial, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="12" fill="#333333">T4b. 기각</text>
  <text x="370" y="447.0" dy="0.35em" text-anchor="middle" font-family="'Trebuchet MS', Verdana, Arial, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="11" fill="#333333">(실패 피드백만 다음 변이에 전달)</text>
